# amara 静态站 Nginx 生产配置（阿里云）。HTTPS 见 README
# 与 amara.local.conf 仅 server_name / root / 日志路径不同

map $status $amara_is_404 { 404 1; default 0; }

server {
    listen 80;
    server_name amara.cbmcc.cn;
    root /var/www/amara/site;
    index index.html;
    charset utf-8;

    # 重定向用相对地址（/gy -> /gy/），避免容器端口映射/反向代理下跳错端口
    absolute_redirect off;

    access_log /var/log/nginx/amara.access.log;
    # 所有 404 单独记录，便于逐条处理
    access_log /var/log/nginx/amara.404.log combined if=$amara_is_404;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # 原站 URL：/gy、/productinfo/123.html；镜像存为 /gy/index.html
    location / {
        try_files $uri $uri/ =404;
    }

    # 外域资源（CDN 图片/JS/CSS）文件名不变，长缓存
    location /_ext/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # 原建站平台后端接口（访问统计/验证码开关/客服等），静态站无后端，返回空结果避免前端报错
    location ~ ^/(PageVisit/|Designer/Common/|Common/GetIdHitDic|toc/api/) {
        default_type application/json;
        return 200 '{}';
    }

    # 清单文件不对外
    location = /_manifest.json { return 404; }

    error_page 404 /404.html;
    location = /404.html { internal; }
}
